<style>
    .custom-social-connect {
        font-family: Arial, sans-serif;
        text-align: center;
        padding: 40px 15px;
        background-color: #fcfcfd;
    }

    /* Tiêu đề */
    .custom-social-connect .social-header h2 {
        font-size: 32px;
        font-weight: bold;
        color: #2b303a;
        margin-bottom: 10px;
    }

    /* Hiệu ứng chữ chuyển màu */
    .custom-social-connect .gradient-text {
        background: linear-gradient(to right, #4a00e0, #8e2de2);
        background-clip: text;
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
    }

    .custom-social-connect .social-header p {
        color: #888;
        font-size: 15px;
        max-width: 600px;
        margin: 0 auto 30px auto;
        line-height: 1.5;
    }

    /* Khu vực chứa các thẻ mạng xã hội */
    .custom-social-cards {
        display: flex;
        justify-content: center;
        gap: 20px;
        flex-wrap: wrap;
    }

    /* Thẻ mạng xã hội */
    .custom-social-card {
        background-color: #2b3240;
        border-radius: 16px;
        padding: 30px 20px;
        width: 280px;
        box-sizing: border-box;
        box-shadow: 0 10px 20px rgba(0, 0, 0, 0.1);
        display: flex;
        flex-direction: column;
        align-items: center;
    }

    /* Icon mạng xã hội */
    .social-icon-wrapper {
        width: 60px;
        height: 60px;
        border-radius: 12px;
        display: flex;
        align-items: center;
        justify-content: center;
        margin-bottom: 15px;
    }

    .social-icon-wrapper img {
        width: 40px;
        height: 40px;
        border-radius: 8px;
        object-fit: contain;
    }

    /* Tiêu đề từng thẻ */
    .custom-social-card h3 {
        color: #ffffff;
        font-size: 20px;
        margin: 0 0 5px 0;
    }

    .custom-social-card p.sub-title {
        color: #a0a5b1;
        font-size: 14px;
        margin: 0 0 20px 0;
    }

    /* Khung mã QR */
    .qr-box {
        background-color: #ffffff;
        padding: 10px;
        border-radius: 12px;
        width: 150px;
        height: 150px;
        margin-bottom: 20px;
        box-sizing: border-box;
    }

    .qr-box img {
        width: 100%;
        height: 100%;
        object-fit: contain;
    }

    /* Nút truy cập mạng xã hội */
    .social-btn {
        width: 100%;
        padding: 12px 0;
        border-radius: 8px;
        text-decoration: none;
        font-weight: bold;
        font-size: 14px;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        transition: opacity 0.3s ease;
        box-sizing: border-box;
    }

    .social-btn:hover {
        opacity: 0.85;
    }

    /* Nút Facebook */
    .btn-facebook {
        background-color: #1877F2;
        color: #ffffff;
    }

    /* Nút TikTok */
    .btn-tiktok {
        background-color: #ffffff;
        color: #000000;
    }

    /* Nút Zalo */
    .btn-zalo {
        background-color: #0088FF;
        color: #ffffff;
    }

    /* Tối ưu hiển thị trên điện thoại */
    @media (max-width: 768px) {
        .custom-social-connect {
            padding: 30px 15px;
        }

        .custom-social-connect .social-header h2 {
            font-size: 25px;
        }

        .custom-social-cards {
            gap: 20px;
        }

        .custom-social-card {
            width: 100%;
            max-width: 320px;
        }
    }
</style>

<div class="custom-social-connect">

        <p>
            Hãy chọn kênh truyền thông yêu thích của bạn hoặc sử dụng
            máy ảnh điện thoại quét mã QR để theo dõi tin tức mới nhất!
        </p>
    </div>

    <!-- Các thẻ mạng xã hội -->
    <div class="custom-social-cards">

        <!-- Facebook -->
        <div class="custom-social-card">

            <div class="social-icon-wrapper">
                <img

            <div class="qr-box">

            <h3>TikTok</h3>

            <div class="qr-box">

            <a

        <!-- Zalo -->

            <a

</div>
